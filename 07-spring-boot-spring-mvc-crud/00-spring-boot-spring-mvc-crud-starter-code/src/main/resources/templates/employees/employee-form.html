<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Save Employee</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <div class="container">
        <h3>Employee Directory</h3>
        <p class="h4 mb-4">Save Employee</p>
        <form action="#" th:action="@{/employees/save}" th:object="${employee}" method="post">
            <input type="hidden" th:field="*{id}" />
            <input type="text" id="firstName" th:field="*{firstName}" placeholder="First Name" class="form-control mb-4 w-25" />
            <input type="text" id="lastName" th:field="*{lastName}" placeholder="Last Name" class="form-control mb-4 w-25" />
            <input type="email" id="email" th:field="*{email}" placeholder="Email" class="form-control mb-4 w-25" />

            <button type="submit" class="btn btn-info col-2">Save</button>
        </form>

        <hr>
        <a th:href="@{/employees/list}" >Back to Employee List</a>
    </div>
</body>
</html>
