<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Registration Form</title>

    <style>
        .error {color: red;}
    </style>
</head>
<body>
    <i>Fill out the form. Asterisk (*) means required.</i>
    <br><br>
    <form th:action="@{/processForm}" th:object="${customer}" method="POST">
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" th:field="*{firstName}" />
        <br><br>

        <label for="lastName">Last Name*:</label>
        <input type="text" id="lastName" th:field="*{lastName}" required />

        <!-- Add error message (if present) -->
        <span th:if="${#fields.hasErrors('lastName')}"
              th:errors="*{lastName}"
              class="error"></span>
        <br><br>
        <label for="freePasses">Free Passes*:</label>
        <input type="text" id="freePasses" th:field="*{freePasses}" required />
        <!-- Add error message (if present) -->
        <span th:if="${#fields.hasErrors('freePasses')}"
              th:errors="*{freePasses}"
              class="error"></span>
        <br><br>
        <label for="postalCode">Postal Code*:</label>
        <input type="text" id="postalCode" th:field="*{postalCode}" />
        <!-- Add error message (if present) -->
        <span th:if="${#fields.hasErrors('postalCode')}"
              th:errors="*{postalCode}"
              class="error"></span>
        <br><br>
        <label for="courseCode">Course Code*:</label>
        <input type="text" id="courseCode" th:field="*{courseCode}" />
        <!-- Add error message (if present) -->
        <span th:if="${#fields.hasErrors('courseCode')}"
              th:errors="*{courseCode}"
              class="error"></span>
        <br><br>
        <button type="submit" >Submit</button>
    </form>
</body>
</html>
