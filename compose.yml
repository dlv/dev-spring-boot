services:
  mysql:
    image: mysql:8.0
    container_name: mysql_8_container
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: employee_directory
      MYSQL_USER: springstudent
      MYSQL_PASSWORD: springstudent
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
